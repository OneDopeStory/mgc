# Alex Dispatch — nginx site config
# Deploy to: /etc/nginx/sites-available/agentdispatch.mgcglobalconsulting.com
#
# Steps after uploading:
#   ln -s /etc/nginx/sites-available/agentdispatch.mgcglobalconsulting.com \
#          /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Run certbot BEFORE enabling the 443 block (setup.sh handles this):
#   certbot --nginx -d agentdispatch.mgcglobalconsulting.com

server {
    listen 80;
    server_name agentdispatch.mgcglobalconsulting.com;
    # Certbot will rewrite this block to handle the ACME challenge
    # and add a permanent redirect to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agentdispatch.mgcglobalconsulting.com;

    ssl_certificate     /etc/letsencrypt/live/agentdispatch.mgcglobalconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentdispatch.mgcglobalconsulting.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Only expose the two endpoints the dispatch server needs.
    # Everything else returns 404 — no admin surface exposed.
    location /webhook {
        proxy_pass          http://127.0.0.1:8080;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    Host $host;
        proxy_read_timeout  15s;
        proxy_send_timeout  10s;
        client_max_body_size 64k;
    }

    location /health {
        proxy_pass          http://127.0.0.1:8080;
        proxy_read_timeout  5s;
    }

    location / {
        return 404;
    }
}
