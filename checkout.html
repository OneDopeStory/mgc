<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout — MGC Global Consulting</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --abyss:#010C1A;--navy:#041428;--ocean:#061D35;
  --cyan:#00D4FF;--gold:#FFB347;--white:#FFFFFF;
  --muted:#B8D8F0;--dim:#7AB8E0;
  --border:rgba(0,212,255,0.15);--surface:rgba(6,29,53,0.85);
  --error:#EF4444;
  --font-display:'Raleway',sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html{height:100%}
body{
  font-family:var(--font-body);
  background:var(--abyss);
  color:var(--white);
  display:flex;align-items:center;justify-content:center;
  min-height:100svh;margin:0;padding:1.5rem 1rem;
  background-image:
    radial-gradient(ellipse 70% 60% at 50% 0%,rgba(0,212,255,0.07),transparent),
    radial-gradient(ellipse 50% 40% at 80% 80%,rgba(14,84,148,0.06),transparent);
}

.checkout-card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:3rem 2.5rem;
  border-radius:20px;
  max-width:480px;
  width:100%;
  text-align:center;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 32px 80px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.08);
}

.logo-mark{
  width:64px;height:64px;
  background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(0,212,255,0.05));
  border:1.5px solid rgba(0,212,255,0.25);
  border-radius:16px;
  margin:0 auto 1.75rem;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.logo-mark img{width:48px;height:48px;object-fit:contain}

h1{
  font-family:var(--font-display);
  font-size:1.35rem;font-weight:800;
  letter-spacing:-0.02em;
  margin-bottom:0.75rem;
  color:var(--white);
}
.sub{
  color:var(--muted);
  font-size:0.875rem;
  line-height:1.65;
  margin-bottom:2rem;
}

.spinner{
  width:44px;height:44px;
  border:3px solid rgba(0,212,255,0.15);
  border-top-color:var(--cyan);
  border-radius:50%;
  margin:0 auto 2rem;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.error-icon{
  width:44px;height:44px;
  border-radius:50%;
  background:rgba(239,68,68,0.12);
  border:1.5px solid rgba(239,68,68,0.3);
  display:none;align-items:center;justify-content:center;
  margin:0 auto 1.5rem;
}
.error-icon svg{width:22px;height:22px;stroke:var(--error);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

.error-box{
  background:rgba(239,68,68,0.08);
  border:1px solid rgba(239,68,68,0.25);
  border-radius:10px;
  padding:0.875rem 1rem;
  font-size:0.82rem;
  color:#fca5a5;
  line-height:1.55;
  display:none;
  margin-bottom:1.5rem;
}

.tier-badge{
  display:inline-block;
  background:rgba(0,212,255,0.1);
  border:1px solid rgba(0,212,255,0.2);
  border-radius:8px;
  padding:0.35rem 0.85rem;
  font-family:var(--font-display);
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--cyan);
  margin-bottom:1.5rem;
}
.tier-badge.elite{
  background:rgba(255,179,71,0.1);
  border-color:rgba(255,179,71,0.2);
  color:var(--gold);
}

.btn-back{
  display:inline-block;
  color:var(--muted);
  text-decoration:none;
  font-size:0.82rem;
  font-weight:600;
  transition:color 0.2s;
}
.btn-back:hover{color:var(--cyan)}

.btn-retry{
  display:inline-block;
  background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(0,212,255,0.08));
  border:1px solid rgba(0,212,255,0.25);
  color:var(--cyan);
  font-family:var(--font-display);
  font-weight:700;
  font-size:0.85rem;
  padding:0.7rem 1.5rem;
  border-radius:10px;
  text-decoration:none;
  cursor:pointer;
  transition:all 0.2s;
  margin-bottom:1rem;
  display:none;
}
.btn-retry:hover{background:rgba(0,212,255,0.15);border-color:rgba(0,212,255,0.4)}
.btn-retry{width:100%;min-height:48px;background:var(--cyan);color:var(--abyss);font-size:1rem}
.btn-retry:hover{background:var(--white)}
.btn-retry:disabled{opacity:.65;cursor:wait}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.checkout-help{margin-top:1.5rem;font-size:.8rem;line-height:1.8;color:var(--muted)}
.checkout-help a{color:var(--cyan);overflow-wrap:anywhere}
@media(max-width:480px){.checkout-card{padding:2rem 1.25rem}h1{font-size:1.5rem}.tier-badge{line-height:1.6}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}*{transition:none!important}}

/* SVG icon overrides — match global rule */
[class$="-icon"] svg,[class*="-icon "] svg{width:24px;height:24px;transition:transform 0.25s ease,opacity 0.25s ease}
</style>
</head>
<body>

<main class="checkout-card" aria-labelledby="checkout-heading">

  <div class="logo-mark">
    <img src="assets/mgc-logo-transparent.png" alt="MGC Global">
  </div>

  <div id="tier-badge-wrap" style="display:none"></div>

  <h1 id="checkout-heading" aria-live="polite">Secure payment</h1>
  <p class="sub" id="checkout-msg">Review your selection before continuing to Stripe.</p>

  <div class="spinner" id="spinner" aria-hidden="true" style="display:none"></div>

  <div class="error-icon" id="error-icon">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>

  <div class="error-box" id="error-box" role="alert"></div>

  <button class="btn-retry" id="btn-retry" type="button">Continue to secure payment</button>

  <a href="/services" class="btn-back" id="btn-back">Back to services</a>
  <p class="checkout-help">Need help?<br><a href="mailto:mark@mgcglobalconsulting.com">mark@mgcglobalconsulting.com</a><br><a href="tel:+14432088178">1.443.208.8178</a></p>
  <noscript><p class="checkout-help">Enable JavaScript to pay online, or contact us to arrange payment.</p></noscript>

</main>

<script src="assets/checkout.js" defer></script>
</body>
</html>
