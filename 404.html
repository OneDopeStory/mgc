<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --abyss:#010C1A; --deep:#031525; --navy:#041C35; --mid:#062B52;
  --royal:#0047CC; --electric:#0066FF; --bright:#00BBFF; --cyan:#00D4FF;
  --ice:#B8D8F0; --white:#FFFFFF; --gold:#CBD5DE;
  --t-mid:rgba(180,215,240,0.72); --t-hi:rgba(180,215,240,0.92); --t-dim:rgba(180,215,240,0.45);

  --display:'Raleway',sans-serif; --ui:'Plus Jakarta Sans',sans-serif; --body:'Outfit',sans-serif;
  --radius:20px; --pill:100px;
}
body{background:var(--abyss);color:var(--ice);font-family:var(--body);font-weight:300;line-height:1.8;min-height:100vh}
a{color:var(--cyan)}
#scrollBar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--royal),var(--cyan));z-index:100}
.nav{position:sticky;top:0;z-index:50;background:rgba(1,12,26,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--b-mid)}
.nav-inner{max-width:1260px;margin:0 auto;padding:1rem 2.5rem;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.nav-logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--white);font-family:var(--ui);font-weight:700;font-size:.9rem}
.nav-logo img{height:36px;width:auto}
.nav-links{display:flex;gap:1.4rem;flex-wrap:wrap;align-items:center}
.nav-links a{font-family:var(--ui);font-weight:500;font-size:.8rem;color:var(--t-hi);text-decoration:none}
.nav-links a:hover{color:var(--cyan)}
.wrap{max-width:820px;margin:0 auto;padding:4rem 2.5rem 6rem}
@media(max-width:700px){.wrap{padding:2.5rem 1.25rem 4rem}.nav-inner{padding:.9rem 1.25rem}}
.eyebrow{font-family:var(--ui);font-weight:700;font-size:.65rem;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);margin-bottom:1rem}
h1{font-family:var(--display);font-weight:800;color:var(--white);font-size:clamp(2.1rem,4vw,3rem);line-height:1.1;letter-spacing:-1px;margin-bottom:.8rem}
.updated{font-family:var(--ui);font-size:.8rem;color:var(--t-dim);margin-bottom:2.5rem}
.draft{background:rgba(203,213,222,0.08);border:1px solid rgba(203,213,222,0.3);border-radius:var(--radius);padding:1rem 1.2rem;color:var(--gold);font-size:.9rem;margin-bottom:2.5rem}
h2{font-family:var(--display);font-weight:800;color:var(--white);font-size:1.4rem;margin:2.4rem 0 .8rem}
p,li{color:var(--t-mid);font-size:1rem;margin-bottom:.9rem}
ul{padding-left:1.3rem;margin-bottom:1rem}
li{margin-bottom:.45rem}
table{width:100%;border-collapse:collapse;margin:1rem 0 1.5rem;font-size:.9rem}
th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--b-mid);vertical-align:top}
th{font-family:var(--ui);font-weight:700;color:var(--white);font-size:.78rem;letter-spacing:.04em}
td{color:var(--t-mid)}
.err{text-align:center;padding-top:6rem}
.err .code{font-family:var(--ui);font-weight:700;font-size:.75rem;letter-spacing:4px;color:var(--cyan);margin-bottom:1rem}
.err p{max-width:46ch;margin:0 auto 2rem}
.err-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;font-family:var(--ui);font-weight:700;font-size:.9rem;text-decoration:none;border-radius:var(--pill);padding:.8rem 1.6rem}
.btn-main{background:linear-gradient(135deg,var(--royal),var(--electric));color:var(--white);box-shadow:0 0 22px var(--glow)}
.btn-ghost{border:1px solid var(--b-mid);color:var(--t-hi)}
.btn:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<div id="scrollBar"></div>
<nav class="nav">

<main class="wrap err">

  <h1>This page doesn&rsquo;t exist.</h1>

  <div class="err-actions">
    <a class="btn btn-main" href="/#booking">Book a Strategy Call</a>
    <a class="btn btn-ghost" href="/membership.html">See Membership Plans</a>
    <a class="btn btn-ghost" href="/">Back to Home</a>

<script>
window.addEventListener('scroll', function () {
  var h = document.documentElement.scrollHeight - innerHeight;
  document.getElementById('scrollBar').style.width = (h > 0 ? (scrollY / h) * 100 : 0) + '%';
}, { passive: true });
</script>
</body>
</html>
