# ── API routes (rewrites to Netlify functions) ─────────────────────────
# TrueAssist web chat: POST to chat, GET to poll for relayed team replies.
[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/trueassist"
  status = 200
  force  = true

# Slack Events API request URL for the TrueAssist thread relay.
[[redirects]]
  from   = "/api/slack/events"
  to     = "/.netlify/functions/slack-events"
  status = 200
  force  = true

# Catch-all: blocks the unrelated api/ scaffold's static files (api/index.html, api/config/*,
# etc. — a separate Zapier/webhook project living in this repo). Placed AFTER the two real
# /api/chat and /api/slack/events rewrites above so it never shadows them.
[[redirects]]
  from   = "/api/*"
  to     = "/404"
  status = 404
  force  = true

[[redirects]]
  from   = "/404"
  to     = "/404.html"
  status = 404

[[redirects]]
  from   = "/403"
  to     = "/403.html"
  status = 403

[[redirects]]
  from   = "/500"
  to     = "/500.html"
  status = 500

# ── Security headers ───────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/hs-breeze-bridge.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "https://www.mgcglobalconsulting.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
