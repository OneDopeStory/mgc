ACTION 2 — Gmail: Send immediate acknowledgment:
  To: {{1. Email Address}}
  Subject: MGC has your intake — we're routing your request now
  Body: "Hi {{Name}}, we've received your True Assist intake and are routing it to the right team. Expect a response within 24 hours. — Mark Cartwright, CEO, MGC Global Consulting"


## ZAP 8: DAILY MORNING BRIEFING (8 AM)
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Daily Morning Briefing (8am ET)"
Status: ON | Schedule: Every weekday 8:00 AM ET

TRIGGER:
  App: Schedule by Zapier
  Event: Every Day (8:00 AM ET, Mon-Fri)

ACTION 1 — Get new leads from Notion (last 24hrs):
  App: Notion
  Event: Find Database Items
  Filter: Created After = {{yesterday}}

ACTION 2 — Get today's Calendly events:
  App: Calendly
  Event: List Events Today

ACTION 3 — Send to briefing webhook:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/daily-briefing
  Data:
    newLeads:        {{1. Notion Items}}
    calendarEvents:  {{2. Calendly Events}}
    pendingFollowUps:[]  # Can add Notion query for follow-ups
    openInvoices:    []  # Can add finance DB query


