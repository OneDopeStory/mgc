## ZAP 10: WEEKLY FRIDAY SUMMARY (4 PM)
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Weekly Pipeline Summary (Friday 4pm)"
Status: ON | Schedule: Every Friday 4:00 PM ET

TRIGGER:
  App: Schedule by Zapier
  Event: Every Week (Friday, 4:00 PM ET)

ACTION 1 — Notion: Get week's leads:
  App: Notion
  Event: Find Database Items
  Filter: Created After = {{monday of this week}}

ACTION 2 — Send weekly summary:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/weekly-summary
  Data:
    weekData:
      newLeads:        {{1. Items}}
      weekStarting:    {{monday}}
      weekEnding:      {{friday}}


