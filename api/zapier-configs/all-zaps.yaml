## ZAP 1: CONTACT FORM → CLAUDE → SLACK + NOTION CRM
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Contact Form → AI Route + CRM"
Status: ON | Schedule: Instant

TRIGGER:
  App: Webhooks by Zapier
  Event: Catch Hook
  Webhook URL: [Zapier gives you this — put it as your site form's action endpoint]

ACTION 1 — Send to MGC Webhook Server:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/contact-form
  Payload Type: JSON
  Data:
    name:    {{1. Name}}
    email:   {{1. Email Address}}
    phone:   {{1. Phone Number}}
    company: {{1. Company Organization}}
    service: {{1. How Can We Help You}}
    goal:    {{1. Whats Your Main Goal}}
    message: {{1. Tell Us More}}

ACTION 2 — Add to Google Sheets (backup log):
  App: Google Sheets
  Event: Create Spreadsheet Row
  Spreadsheet: "MGC Lead Log"
  Sheet: "All Leads"
  Fields: Name, Email, Phone, Company, Service, Date, Status=New


## ZAP 2: MEMBERSHIP SIGNUP → ONBOARDING SEQUENCE
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Membership Signup → Welcome + Notion"
Status: ON | Schedule: Instant

TRIGGER:
  App: Webhooks by Zapier  (or Stripe — New Payment)
  Event: Catch Hook

FILTER (Step 2):
  Only continue if: Service contains "Join Membership"

ACTION 1:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/membership-signup
  Data:
    name:    {{1. Name}}
    email:   {{1. Email Address}}
    phone:   {{1. Phone Number}}
    company: {{1. Company Organization}}
    tier:    {{1. How Can We Help You}}  # Extracts "Starter" / "Pro" / "Elite"

ACTION 2 — Gmail: Send Welcome Email:
  App: Gmail
  Event: Send Email
  To: {{1. Email Address}}
  From: mark@mgcglobalconsulting.com
  Subject: Welcome to MGC Global Consulting — You're In, {{1. Name}}!
  Body: [Claude's response from Step 1 — map content field]

ACTION 3 — Calendly: Tag as Member:
  App: Calendly (if connected) — add invitee tag "member-{{tier}}"


## ZAP 3: CALENDLY NEW BOOKING → PRE-CALL BRIEF
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Calendly Booking → Pre-Call Brief"
Status: ON | Schedule: Instant

TRIGGER:
  App: Calendly
  Event: Invitee Created

ACTION 1:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/calendly-booking
  Data:
    name:                 {{1. Invitee Name}}
    email:                {{1. Invitee Email}}
    start_time:           {{1. Start Time}}
    event_type:           {{1. Event Type Name}}
    questions_and_answers:{{1. Questions And Answers}}  # Array

ACTION 2 — Gmail: Confirmation + Prep Email to Prospect:
  App: Gmail
  Event: Send Email
  To: {{1. Invitee Email}}
  Subject: Your MGC Strategy Call is Confirmed — Here's What to Expect
  Body: [auto-populated from Claude brief]

ACTION 3 — Google Calendar: Add prep note:
  App: Google Calendar
  Event: Create Detailed Event
  Calendar: Mark's Work Calendar
  Title: "📞 STRATEGY CALL — {{Invitee Name}} | PREP INSIDE"
  Description: {{Claude Pre-Call Brief}}


## ZAP 4: REFERRAL SUBMISSION → DUAL OUTREACH
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Referral → Thank Referrer + Contact Prospect"
Status: ON | Schedule: Instant

TRIGGER:
  App: Webhooks by Zapier
  Event: Catch Hook

FILTER:
  Only continue if: Service = "Submit a Referral" OR "Become a Referral Partner"

ACTION 1:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/referral
  Data:
    referrerName:    {{1. Name}}
    referrerEmail:   {{1. Email Address}}
    referredName:    {{1. Referred Persons Name}}
    referredEmail:   {{1. Referred Persons Email}}
    notes:           {{1. Tell Us More}}
    type:            {{1. How Can We Help You}}

ACTION 2 — Gmail: Send thank-you to referrer:
  Subject: Thank You for the Referral, {{Referrer Name}}! — MGC Global Consulting
  [Body from Claude]

ACTION 3 — Gmail: Send outreach to referred prospect:
  To: {{Referred Email}}
  Subject: {{Referrer Name}} thought we should connect — MGC Global Consulting
  [Body from Claude]


## ZAP 5: DAILY STALE LEAD CHECK
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Daily Stale Lead Recovery (9am ET)"
Status: ON | Schedule: Every day at 9:00 AM ET (Mon-Fri)

TRIGGER:
  App: Schedule by Zapier
  Event: Every Day (9:00 AM ET, Mon-Fri)

ACTION 1 — Query Notion CRM for stale leads:
  App: Notion
  Event: Find Database Item
  Database: [MGC CRM DB ID]
  Filter: Status = "New Lead" AND Created Before = {{today - 2 days}}

ACTION 2:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/stale-lead-check
  Data:
    staleLeads: {{1. Items}}  # Array of Notion records


## ZAP 6: GMAIL INVOICE ALERT → FINANCE CHANNEL
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — Invoice Email → Finance Slack Alert"
Status: ON | Schedule: Instant

TRIGGER:
  App: Gmail
  Event: New Email Matching Search
  Search: "subject:(invoice OR payment OR overdue) from:(OR to:mark@mgcglobalconsulting.com)"

ACTION 1:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/invoice-alert
  Data:
    clientName:    {{1. From Name}}
    invoiceNumber: [Extract from body — use Formatter if needed]
    amount:        [Extract from body]
    dueDate:       [Extract from body]
    status:        {{1. Subject}}
    emailBody:     {{1. Body Plain}}

ACTION 2 — Notion: Log to Finance Tracker:
  App: Notion
  Event: Create Database Item
  Database: [Finance DB]


## ZAP 7: TRUE ASSIST INTAKE ROUTING
## ─────────────────────────────────────────────────────────────────────────────
Name: "MGC — True Assist Intake → Route + Log"
Status: ON | Schedule: Instant

TRIGGER:
  App: Webhooks by Zapier  (or Typeform / JotForm)
  Event: Catch Hook

FILTER:
  Only continue if: Service = "True Assist System"

ACTION 1:
  App: Webhooks by Zapier
  Event: POST
  URL: https://[your-server]/webhook/true-assist-intake
  Data:
    clientName:  {{1. Name}}
    clientEmail: {{1. Email Address}}
    phone:       {{1. Phone Number}}
    company:     {{1. Company Organization}}
    intakeType:  {{1. How Can We Help You}}
    details:     {{1. Tell Us More}}
